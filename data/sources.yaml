# Sources of text, audio and models used by Vedic Voice, with licenses.
# Mirrors the `sources` table (Milestone 1). Add an entry BEFORE using a source.
# retrieved_at = date we fetched/checked the license.
#
# TODO(replace-gretil): GRETIL texts are used for now (decision 2026-10-07), but
# the Ṛgveda files are CC BY-NC-SA and the Gītā file is "reference only". Before
# any paid launch / B2B API, replace every gretil-* source used for learner
# content with a concrete, commercially usable source (e.g. Sanskrit Wikisource
# CC BY-SA, or an advisor-verified transcription we own) and re-verify the shlokas.

texts:
  - id: gretil-bhagavadgita
    name: "Bhagavadgītā, GRETIL (BORI critical edition; Tokunaga et al., rev. John Smith)"
    url: https://gretil.sub.uni-goettingen.de/gretil/1_sanskr/2_epic/mbh/ext/bhgce__u.htm
    license: "GRETIL terms: 'for reference purposes only; copyright and terms of usage as for source file'"
    license_url: https://gretil.sub.uni-goettingen.de/gretil.html
    retrieved_at: 2026-10-06
    notes: >
      Used for BG 3.1 test text in the scoring spike. License for redistribution
      in the app is unclear -> check the TEI source header / ask GRETIL before
      shipping verse text from this file to learners.
  - id: gretil-rigveda-aufrecht
    name: "Ṛgveda-Saṃhitā, GRETIL (Aufrecht ed.; data entry Van Nooten & Holland)"
    url: https://gretil.sub.uni-goettingen.de/gretil/corpustei/sa_Rgveda-edAufrecht.xml
    license: CC-BY-NC-SA-4.0
    license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
    retrieved_at: 2026-10-06
    notes: >
      NON-COMMERCIAL. Fine for the spike and a free MVP, but a paid app or the
      B2B API would need another source for Gayatri (RV 3.62.10) and
      Mahāmṛtyuñjaya (RV 7.59.12), e.g. Sanskrit Wikisource (CC BY-SA) or
      our own advisor-verified transcription of the (public-domain) mantra.

  - id: gretil-rigveda-padapatha
    name: "Ṛgveda-Saṃhitā Padapāṭha, GRETIL"
    url: https://gretil.sub.uni-goettingen.de/gretil/corpustei/sa_RgvedasaMhitApadapATha.xml
    license: CC-BY-NC-SA-4.0
    license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
    retrieved_at: 2026-10-07
    notes: "Traditional word split for Ṛgveda mantras (Milestone 0b). NON-COMMERCIAL, like the Saṃhitā text."
  - id: gretil-brhadaranyaka
    name: "Bṛhadāraṇyaka Upaniṣad (Kāṇva) with Śaṅkara's commentary, GRETIL"
    url: https://gretil.sub.uni-goettingen.de/gretil/corpustei/sa_bRhadAraNyakopaniSadkANva-recension-comm.xml
    license: CC-BY-NC-SA-4.0
    license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
    retrieved_at: 2026-10-07
    notes: "Asato mā (BṛU 1.3.28). NON-COMMERCIAL - see TODO(replace-gretil)."
  - id: gretil-isa
    name: "Īśa Upaniṣad (Kāṇva) with commentary, GRETIL"
    url: https://gretil.sub.uni-goettingen.de/gretil/corpustei/sa_IzopaniSad-or-IzAvAsyopaniSadkANva-recension-comm.xml
    license: CC-BY-NC-SA-4.0
    license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
    retrieved_at: 2026-10-07
    notes: "Pūrṇamadaḥ śānti-pāṭha. NON-COMMERCIAL - see TODO(replace-gretil)."
  - id: gretil-taittiriya
    name: "Taittirīya Upaniṣad with Śaṅkara's commentary, GRETIL"
    url: https://gretil.sub.uni-goettingen.de/gretil/corpustei/sa_taittirIyopaniSad-zaMkarabhASya.xml
    license: CC-BY-NC-SA-4.0
    license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/
    retrieved_at: 2026-10-07
    notes: "Oṃ saha nāvavatu śānti-pāṭha. NON-COMMERCIAL - see TODO(replace-gretil)."
  - id: wikisource-pratahsmaranam
    name: "प्रातःस्मरणम्, Sanskrit Wikisource"
    url: https://sa.wikisource.org/wiki/%E0%A4%AA%E0%A5%8D%E0%A4%B0%E0%A4%BE%E0%A4%A4:%E0%A4%B8%E0%A5%8D%E0%A4%AE%E0%A4%B0%E0%A4%A3%E0%A4%AE%E0%A5%8D
    license: CC-BY-SA-4.0
    license_url: https://creativecommons.org/licenses/by-sa/4.0/
    retrieved_at: 2026-10-07
    notes: "Vakratuṇḍa (verse 1) and Guru Brahmā (verse 6). Contains typos (kurū, guravai) - see review_notes."
  - id: wikisource-karadarsanam
    name: "करदर्शनम्, Sanskrit Wikisource"
    url: https://sa.wikisource.org/wiki/%E0%A4%95%E0%A4%B0%E0%A4%A6%E0%A4%B0%E0%A5%8D%E0%A4%B6%E0%A4%A8%E0%A4%AE%E0%A5%8D
    license: CC-BY-SA-4.0
    license_url: https://creativecommons.org/licenses/by-sa/4.0/
    retrieved_at: 2026-10-07
    notes: "Karāgre vasate."
  - id: dcs-morphology
    name: "Digital Corpus of Sanskrit (O. Hellwig) gold morphology, HF mirror sampathlonka/DCS_Sanskrit_Morphology_v1"
    url: https://huggingface.co/datasets/sampathlonka/DCS_Sanskrit_Morphology_v1
    license: "CC-BY-4.0 (DCS); mirror declares Apache-2.0"
    license_url: https://creativecommons.org/licenses/by/4.0/
    retrieved_at: 2026-10-07
    notes: "Evaluation only (data/spike/eval_dcs.py); not shipped."

audio:
