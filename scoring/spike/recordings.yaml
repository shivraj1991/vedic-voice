# Candidate public test recordings for the Milestone 0 scoring spike.
#
# Why this file exists: CLAUDE.md requires every public recording used for
# testing to carry a recorded license and attribution. Metadata was pulled
# from the Wikimedia Commons API on 2026-10-06. Audio is NOT committed;
# the spike harness downloads by `url` and checks `sha1` (Commons' hash).
#
# `use` says how the spike may use the file:
#   reference  - clean, complete chant of the target shloka
#   test       - extra rendition to score against a reference
#   review     - must be listened to first (content/segment unknown)

recordings:
