# Manual: apply Alembic migrations (and optionally the seed) to a Neon branch.
# Actions -> neon-migrate -> Run workflow. Uses the OWNER role's DIRECT URL
# (migrations need DDL rights; the app role vv_app deliberately has none).
name: neon-migrate

on:
  workflow_dispatch:
    inputs:
      seed:
        description: "Also load the initial seed (idempotent, never overwrites)"
        type: boolean
        default: true
      regrant:
        description: "Re-apply vv_app grants (re-runs migration 0002; use after recreating vv_app)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: neon-test   # optional: add required reviewers in repo settings
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL_MIGRATIONS: ${{ secrets.NEON_MIGRATIONS_URL }}
    steps:
      # Checkout first: every run step uses working-directory backend/ (defaults above).
      - uses: actions/checkout@v4
      - name: Require secret
        run: test -n "$DATABASE_URL_MIGRATIONS" || (echo "Set NEON_MIGRATIONS_URL secret" && exit 1)
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - name: Re-apply vv_app grants (downgrade 0002 only revokes grants)
        if: inputs.regrant
        run: uv run alembic downgrade 0001
      - run: uv run alembic upgrade head
      - run: uv run alembic current
      - name: Seed
        if: inputs.seed
        env:
          DATABASE_URL: ${{ secrets.NEON_MIGRATIONS_URL }}
        run: uv run python -m vv_backend.seed
      - name: Check vv_app privileges
        env:
          DATABASE_URL: ${{ secrets.NEON_MIGRATIONS_URL }}
        run: uv run python -m vv_backend.db.check_app_role
